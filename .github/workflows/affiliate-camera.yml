name: Affiliate recording visibility
on:
  pull_request:
    paths:
      - 'qa/affiliates/**'
      - '.github/workflows/affiliate-camera.yml'
jobs:
  camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm --dir qa/affiliates install --frozen-lockfile --ignore-workspace
      - run: pnpm --dir qa/affiliates exec playwright install --with-deps chromium
      - run: node --test qa/affiliates/check-camera.mjs
